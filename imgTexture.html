<!DOCTYPE html>
<html>
  <head>
    <title>A-Frame Offline Test</title>
    <!-- Include local A-Frame library -->
    <script src=" https://aframe.io/releases/1.7.1/aframe.min.js "></script>
  </head>
  <body>
    <a-scene>
      <a-sphere position="0 1 -3" radius="1" src="earth_scaled.jpg"
      animation="property: rotation; to: 0 360 0; dur: 10000; loop:true"
      ></a-sphere>


        
      <a-sphere position="3 1.3 -4" radius="0.5" src="moonimg_scaled.jpg"
      animation="property: rotation; to: 0 360 0; dur: 10000; loop:true"
      ></a-sphere>
    </a-scene>
  </body>
</html>
